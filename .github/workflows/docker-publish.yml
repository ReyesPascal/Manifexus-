name: Build & Publish Manifexus to GHCR

on:
  push:
    branches: [ "main", "master" ]
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: reyespascal/manifexus
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # to create the vX.Y.Z Git tag for each version
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0   # full history, so older versions can be tagged at their commit

      # The version comes from release-notes.json (the newest entry), so every release gets
      # numbered image tags (1.1.0, 1.1) and a Git tag (v1.1.0) without anyone tagging by hand.
      - name: Read version from release notes
        id: version
        run: |
          v=$(jq -r '.releases[0].version' release-notes.json)
          case "$v" in *.*.*) ;; *.*) v="$v.0" ;; *) v="$v.0.0" ;; esac
          echo "full=$v" >> "$GITHUB_OUTPUT"
          echo "minor=${v%.*}" >> "$GITHUB_OUTPUT"
          echo "Version $v"

      - name: Set up QEMU for multi-arch builds
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry (GHCR)
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ steps.version.outputs.full }},enable={{is_default_branch}}
            type=raw,value=${{ steps.version.outputs.minor }},enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

      # Git tags for every version, and numbered images for older versions that were
      # released before this was automatic (release-notes.json gives their commit).
      - name: Tag versions
        if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          CURRENT: ${{ steps.version.outputs.full }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --tags --force --quiet
          jq -r '.releases[] | [.version, (.commit // "")] | @tsv' release-notes.json | while IFS=$'\t' read -r v commit; do
            case "$v" in *.*.*) ;; *.*) v="$v.0" ;; *) v="$v.0.0" ;; esac
            if [ "$v" = "$CURRENT" ]; then commit="$GITHUB_SHA"; fi
            [ -n "$commit" ] || continue
            if ! git cat-file -e "$commit^{commit}" 2>/dev/null; then echo "::warning::Commit $commit for $v not found"; continue; fi
            if ! git rev-parse -q --verify "refs/tags/v$v" >/dev/null; then
              git tag -a "v$v" "$commit" -m "Manifexus $v" && git push origin "v$v" && echo "Tagged v$v"
            fi
            if [ "$v" != "$CURRENT" ] && ! docker buildx imagetools inspect "$IMAGE:$v" >/dev/null 2>&1; then
              short=$(git rev-parse --short=7 "$commit")
              if docker buildx imagetools inspect "$IMAGE:sha-$short" >/dev/null 2>&1; then
                docker buildx imagetools create -t "$IMAGE:$v" -t "$IMAGE:${v%.*}" "$IMAGE:sha-$short" && echo "Image $v from sha-$short"
              else
                echo "::warning::No image for $v (sha-$short); it can't be offered as a version to go back to."
              fi
            fi
          done
